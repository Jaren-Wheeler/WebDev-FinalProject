    <section id="contact-me">
        <h2>Follow me</h2>
        <div id="icon-container">
            <a href="https://www.instagram.com/"><img src="img/instagram_icon.png" alt="instagram icon"></a>
            <a href="https://x.com/?lang=en"><img src="img/x-icon.png" alt="X icon"></a>
            <a href="https://www.facebook.com/"><img src="img/facebook-icon.png" alt="Facebook icon"></a>
            <a href="https://www.linkedin.com/feed/"><img src="img/linkedin-icon.png" alt="LinkedIn icon"></a>
        </div>

        <div id="msg-container">
            <form id="contact-form">
                <label for="email">Enter your Email:</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>
            
                <div id="error-message">Please enter a valid email address.</div>
            
                <button type="submit">Submit</button>
            </form>
        </div>
    </section>
